<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private interactive 3D human anatomy atlas">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Human Anatomy Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an engineering assembly sheet — title-block strip on top, parts list / process sheet left, 3-D model centre, key data right. Shared by all organ pages. */
:root {
  --paper: #eef1f2; --panel: #f8fafa; --ink: #17212a; --muted: #5a6872; --line: #cdd5da; --grid: #dfe5e8;
  --accent: #0b7285; --accent-ink: #ffffff; --oxy: #c0392b; --deoxy: #2f5fb3; --open: #2b8a3e; --closed: #b42318; --warn: #a15c07;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --view-bg: #e4e9eb;
}
/* Farsi: Vazirmatn (with system Persian fallbacks); no letter-spacing or upper-casing, which break Arabic-script joining */
#app[lang="fa"] { --f-display: 'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif; --f-body: 'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif; --f-mono: 'Vazirmatn', 'Tahoma', ui-monospace, monospace; }
#app[lang="fa"] * { letter-spacing: 0 !important; text-transform: none !important; }
#app[lang="fa"] .titleblock h1 { font-size: 24px; line-height: 1.3; }
#app[lang="fa"] .phase .pname { font-size: 20px; line-height: 1.35; }
#app[lang="fa"] .card h3 { line-height: 1.4; }
#app[lang="fa"] .steps li::before { content: counter(s, persian); }
#app[lang="fa"] .lbl { font-size: 12px; line-height: 1.3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1318; --panel: #121a20; --ink: #dce4e8; --muted: #8f9da6; --line: #26323b; --grid: #1b252c;
  --accent: #4cb6c9; --accent-ink: #062027; --oxy: #e5675a; --deoxy: #6f9be6; --open: #5cc27a; --closed: #f07167; --warn: #e3a64c; --view-bg: #0a0f13; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0d1318; --panel: #121a20; --ink: #dce4e8; --muted: #8f9da6; --line: #26323b; --grid: #1b252c;
  --accent: #4cb6c9; --accent-ink: #062027; --oxy: #e5675a; --deoxy: #6f9be6; --open: #5cc27a; --closed: #f07167; --warn: #e3a64c; --view-bg: #0a0f13; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); font-family: var(--f-body); }

/* ---- title block ---- */
.titleblock { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; padding: 10px 16px 8px; border-bottom: 1.5px solid var(--ink); }
.titleblock h1 { font: 700 26px/1 var(--f-display); letter-spacing: .02em; margin: 0; text-transform: uppercase; text-wrap: balance; }
.titleblock .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.tb-cells { display: flex; border: 1px solid var(--line); font-size: 11px; align-items: stretch; }
.tbr { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; justify-content: flex-end; }
.langsw button { font-size: 12.5px; }
.tb-cells div { padding: 3px 8px; border-inline-start: 1px solid var(--line); min-width: 0; }
.tb-cells div:first-child { border-inline-start: 0; }
.tb-cells b { display: block; font: 600 10px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---- main grid ---- */
.main { display: grid; grid-template-columns: 330px minmax(0, 1fr) 300px; min-height: 0; }
.side, .live { background: var(--panel); min-height: 0; overflow: auto; }
.side { border-inline-end: 1px solid var(--line); }
.live { border-inline-start: 1px solid var(--line); padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }

.tabs { display: flex; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2; }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 6px 8px; font: 600 14px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpane { padding: 10px 14px 18px; }

h2 { font: 600 15px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; margin: 14px 0 6px; color: var(--muted); }
h2:first-child { margin-top: 2px; }

/* BOM list */
.bom { list-style: none; margin: 0; padding: 0; }
.bom li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; align-items: center; gap: 6px; padding: 4px 4px; border-bottom: 1px dashed var(--grid); cursor: pointer; border-radius: 3px; }
.bom li:hover { background: var(--grid); }
.bom li.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.bom li.hl { border-inline-start: 3px solid var(--accent); }
.bom .item { font: 500 11px var(--f-mono); color: var(--muted); }
.bom .nm { min-width: 0; overflow-wrap: anywhere; }
.bom .sw { width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--line); flex: none; }
.bom li { grid-template-columns: 12px minmax(0, 1fr) auto auto; }
.gh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gh .eye { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 12px; }
.gh .eye[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }
.facts { display: flex; flex-direction: column; gap: 8px; }
.fact { border-bottom: 1px solid var(--grid); padding-bottom: 6px; }
.fact b { display: block; font: 600 11px/1.3 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fact span { font-size: 13.5px; }
.fact .tag { margin-inline-start: 4px; }
.flowkey { flex-wrap: wrap; }
.gkey { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.gkey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 4px; vertical-align: -1px; }
.bom .flag { font: 600 10px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 2px 4px; border: 1px solid var(--warn); color: var(--warn); border-radius: 2px; }
.bom .eye { background: none; border: 0; padding: 2px 4px; cursor: pointer; color: var(--muted); font-size: 12px; }
.bom .eye[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }
.bom li.missing { cursor: default; color: var(--muted); font-style: italic; }

/* steps */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 6px; }
.steps li { counter-increment: s; border: 1px solid var(--line); border-radius: 4px; padding-block: 8px; padding-inline: 38px 10px; position: relative; cursor: pointer; background: var(--paper); }
.steps li::before { content: counter(s); position: absolute; inset-inline-start: 10px; top: 8px; font: 700 18px/1 var(--f-display); color: var(--accent); }
.steps li.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.steps b { display: block; font-weight: 600; margin-bottom: 2px; }
.steps span { color: var(--muted); font-size: 13px; }

/* data tab */
.tbl-wrap { overflow-x: auto; }
table.kv { border-collapse: collapse; width: 100%; font-size: 12px; }
table.kv th, table.kv td { text-align: start; padding: 3px 4px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.kv th { font: 600 11px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tag { display: inline-block; font: 600 10px/1.3 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap; }
.tag.meas { color: var(--accent); } .tag.ref { color: var(--open); } .tag.asm { color: var(--warn); }
.prose { font-size: 13px; max-width: 65ch; }
.prose p { margin: 6px 0; }
.refs { font-size: 12px; color: var(--muted); padding-inline-start: 18px; direction: ltr; text-align: left; }
.refs li { margin-bottom: 4px; overflow-wrap: anywhere; }
a { color: var(--accent); }

/* ---- viewport ---- */
.stage { position: relative; min-height: 0; min-width: 0; }
.viewport { position: absolute; inset: 0; z-index: 0; background: var(--view-bg); overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; direction: ltr; } /* CSS2DRenderer positions from the left edge */
.lbl { unicode-bidi: plaintext; font: 600 12px/1 var(--f-display); letter-spacing: .05em; color: var(--ink); background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); padding: 2px 5px; border-radius: 2px; white-space: nowrap; pointer-events: none; }
.lbl.valve-open { border-color: var(--open); } .lbl.valve-closed { border-color: var(--closed); }
.orient { position: absolute; inset-inline-start: 12px; top: 10px; font: 500 11px var(--f-mono); color: var(--muted); pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 600 16px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }

.toolbar { z-index: 4; position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; backdrop-filter: blur(6px); }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { font: 600 11px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.btn { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; font-size: 13px; line-height: 1.1; min-height: 32px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 72px; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: var(--paper); border: 0; border-inline-start: 1px solid var(--line); padding: 5px 8px; cursor: pointer; font-size: 12.5px; min-height: 32px; }
.seg button:first-child { border-inline-start: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
input[type=range] { accent-color: var(--accent); width: 120px; }
.sep { width: 1px; align-self: stretch; background: var(--line); }

.card { z-index: 4; position: absolute; inset-inline-start: 12px; top: 34px; width: min(360px, calc(100% - 24px)); max-height: calc(100% - 120px); overflow: auto; background: var(--panel); border: 1px solid var(--ink); border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.card header { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 10px 12px 6px; border-bottom: 1px solid var(--line); }
.card h3 { font: 700 20px/1.05 var(--f-display); margin: 0; text-wrap: balance; }
.card .pn { font: 500 11px var(--f-mono); color: var(--muted); margin-top: 3px; }
.card .x { background: none; border: 0; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px; }
.card .body { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.card dl { margin: 0; display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 4px 10px; }
.card dt { font: 600 11px/1.5 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.card .note { border-inline-start: 3px solid var(--warn); padding: 4px 8px; background: color-mix(in srgb, var(--warn) 10%, transparent); font-size: 12.5px; }

/* ---- live panel ---- */
.phase { display: grid; gap: 2px; }
.phase .pname { font: 700 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.phase .pmeta { font: 500 12px var(--f-mono); color: var(--muted); }
.sysbar { direction: ltr; height: 8px; border-radius: 2px; background: var(--grid); position: relative; overflow: hidden; }
.sysbar i { position: absolute; top: 0; bottom: 0; }
.sysbar .cur { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.valves { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.vchip { border: 1px solid var(--line); border-radius: 4px; padding: 5px 4px; text-align: center; }
.vchip b { display: block; font: 700 14px/1 var(--f-display); letter-spacing: .04em; }
.vchip span { font: 600 10.5px/1.4 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.vchip.open { border-color: var(--open); color: var(--open); }
.vchip.closed { border-color: var(--closed); color: var(--closed); }
table.live-t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.live-t th, table.live-t td { padding: 3px 4px; border-bottom: 1px solid var(--grid); text-align: end; }
table.live-t th:first-child, table.live-t td:first-child { text-align: start; }
table.live-t th { font: 600 11px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#wiggers { width: 100%; height: 170px; display: block; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-inline-end: 4px; }
.foot { font-size: 11.5px; color: var(--muted); }
.flowkey { display: flex; gap: 12px; font-size: 12px; }
.flowkey span::before { content: ''; display: inline-block; width: 0; height: 0; border-left: 9px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-inline-end: 5px; vertical-align: -1px; }

/* ---- phone / narrow ---- */
@media (max-width: 1100px) { .main { grid-template-columns: 300px minmax(0,1fr); } .live { grid-column: 1 / -1; border-inline-start: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } #app { height: auto; } .main { grid-template-rows: 72vh auto; } }
@media (max-width: 760px) {
  #app { height: auto; }
  .titleblock { grid-template-columns: 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tb-cells { flex-wrap: wrap; } .tb-cells div { flex: 1 1 40%; border-inline-start: 0; border-top: 1px solid var(--line); }
  .tbr { justify-content: flex-start; }
  .main { display: flex; flex-direction: column; }
  .stage { display: flex; flex-direction: column; order: 1; }
  .viewport { position: relative; inset: auto; height: 62svh; min-height: 360px; }
  .toolbar { position: static; border-radius: 0; border-left: 0; border-right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .card { position: static; width: auto; max-height: none; margin: 0; border-radius: 0; box-shadow: none; border-left: 0; border-right: 0; }
  .live { order: 4; display: flex; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side { order: 5; border-inline-end: 0; border-top: 1px solid var(--line); overflow: visible; }
  .tabpane { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  input[type=range] { width: 100px; }
  .btn, .seg button { min-height: 38px; }
}

/* ---- v2: reference cards, search, groups, breadcrumb, help ---- */
.card { width: min(430px, calc(100% - 24px)); }
.card .cact { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 0; }
.card .cact .btn { min-height: 30px; font-size: 12.5px; padding: 4px 8px; text-decoration: none; display: inline-flex; align-items: center; }
.csum { margin: 2px 0; font-size: 13.5px; line-height: 1.55; }
.cfields { margin: 0; display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 5px 10px; }
.cfields dt { font: 600 11.5px/1.5 var(--f-display); letter-spacing: .04em; color: var(--accent); }
.cfields dd { margin: 0; line-height: 1.5; }
.clin { border-inline-start: 3px solid var(--oxy); background: color-mix(in srgb, var(--oxy) 9%, transparent); padding: 6px 8px; border-radius: 2px; line-height: 1.5; }
.clin b { color: var(--oxy); margin-inline-end: 4px; }
.crefs { font-size: 11.5px; color: var(--muted); }
.crefs b { font: 600 11px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.crefs ol { margin: 3px 0 0; padding-inline-start: 26px; direction: ltr; text-align: left; }
.crefs li { margin-bottom: 3px; overflow-wrap: anywhere; }
.cmodel summary { cursor: pointer; font: 600 12px var(--f-display); color: var(--muted); letter-spacing: .04em; }
.cmodel dl { margin: 6px 0 0; display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 4px 10px; font-size: 12px; }
.cmodel dt { color: var(--muted); font: 600 11px/1.5 var(--f-display); } .cmodel dd { margin: 0; overflow-wrap: anywhere; }
.cparts { font-size: 12px; } .cparts b { color: var(--muted); font-weight: 600; margin-inline-end: 4px; }
.chip { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; margin: 2px 0; cursor: pointer; font-size: 12px; }
.chip:hover { border-color: var(--accent); }
.search { position: sticky; top: 38px; z-index: 2; background: var(--panel); padding: 8px 14px 6px; border-bottom: 1px solid var(--grid); }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 13.5px; min-height: 36px; }
details.gblock { border-bottom: 1px solid var(--grid); }
details.gblock > summary { list-style: none; cursor: pointer; padding: 8px 2px 6px; }
details.gblock > summary::-webkit-details-marker { display: none; }
details.gblock > summary .gname::before { content: '▸'; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
details.gblock[open] > summary .gname::before { transform: rotate(90deg); }
#app[dir="rtl"] details.gblock > summary .gname::before { content: '◂'; }
#app[dir="rtl"] details.gblock[open] > summary .gname::before { transform: rotate(-90deg); }
.gname { font: 600 14.5px/1.3 var(--f-display); letter-spacing: .03em; display: inline-flex; align-items: center; gap: 4px; }
.gname .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 3px; }
.gcount { font: 500 11px var(--f-mono); color: var(--muted); }
.gact { display: inline-flex; gap: 2px; }
.ginfo { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font: italic 700 13px/1 Georgia, serif; color: var(--accent); }
.bom .has { color: var(--accent); font-size: 9px; }
.gkey .gk { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--muted); font-size: 11.5px; text-align: start; }
.gkey .gk:hover { color: var(--ink); }
.organs { display: flex; flex-wrap: wrap; gap: 5px; }
.btn.small { min-height: 28px; font-size: 12px; padding: 3px 8px; }
.crumbs { margin-top: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.crumbs .crumb { color: var(--muted); }
.help { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 55%, transparent); backdrop-filter: blur(2px); padding: 16px; }
.helpbox { background: var(--panel); border: 1px solid var(--ink); border-radius: 8px; max-width: 460px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.helpbox h3 { margin: 0 0 8px; font: 700 19px var(--f-display); }
.helpbox ul { margin: 0 0 12px; padding-inline-start: 18px; line-height: 1.6; font-size: 13.5px; }
input[type=range]#explode { width: 170px; }
@media (max-width: 760px) { .search { top: 0; position: static; } .cfields { grid-template-columns: 1fr; } .cfields dt { margin-top: 4px; } .help { position: fixed; } }

/* ---- animated page overlay (website) ---- */
.animov { position: fixed; inset: 0; z-index: 15; background: var(--paper); display: flex; flex-direction: column; }
.animbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1.5px solid var(--ink); font-family: 'Vazirmatn', var(--f-body); }
.animov iframe { flex: 1; width: 100%; border: 0; }
.animload { flex: 1; display: grid; place-items: center; color: var(--muted); }
/* ---- website login ---- */
.login { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; font-family: 'Vazirmatn', var(--f-body); }
.loginbox { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 8px; padding: 22px 22px 16px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.loginbox h2 { font: 700 24px/1.2 'Vazirmatn', var(--f-display); color: var(--ink); margin: 4px 0 0; letter-spacing: 0; text-transform: none; }
.loginbox p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); }
.loginbox label { font-size: 13px; color: var(--muted); }
.loginbox input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 16px; background: var(--paper); min-height: 44px; }
.loginbox .btn.primary { min-height: 44px; font-size: 15px; }
.loginmsg { min-height: 1.4em; color: var(--open) !important; } .loginmsg.err { color: var(--closed) !important; }
.loginfoot { font-size: 12px !important; color: var(--muted) !important; border-top: 1px solid var(--grid); padding-top: 8px; }
.loginbox .rem { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13.5px; } .loginbox .rem input { min-height: 0; width: 18px; height: 18px; }
.langrow { display: flex; gap: 6px; justify-content: flex-end; } .langrow button { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 12.5px; }
.langrow button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
