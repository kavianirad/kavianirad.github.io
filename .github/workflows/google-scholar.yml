name: Update Google Scholar stats

on:
  schedule:
    - cron: "0 6 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/scholar_stats.py, .github/workflows/google-scholar.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scholarly==1.7.11
      - run: python tools/scholar_stats.py "$RUNNER_TEMP/gs_data.json"
      - name: Push to google-scholar-stats branch
        run: |
          cd "$RUNNER_TEMP"
          git init -q -b google-scholar-stats stats && cd stats
          cp ../gs_data.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json && git commit -qm "Update Google Scholar stats"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" google-scholar-stats
