name: Update Google Scholar stats

on:
  schedule:
    - cron: "0 6 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/scholar_stats.py, .github/workflows/google-scholar.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scholarly==1.7.11 "httpx<0.28" "bibtexparser<2"
      - name: Fetch stats
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/scholar_stats.py "$RUNNER_TEMP/gs_data.json" 2>&1 | tee "$RUNNER_TEMP/log.txt"
      - name: Push to google-scholar-stats branch
        run: |
          cd "$RUNNER_TEMP"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git init -q -b google-scholar-stats stats && cd stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the last good data when Scholar refuses the request.
          if [ ! -s ../gs_data.json ]; then
            git fetch -q "$REMOTE" google-scholar-stats && git checkout -q FETCH_HEAD -- gs_data.json || true
          else
            cp ../gs_data.json .
          fi
          tail -n 60 ../log.txt > log.txt
          git add -A && git commit -qm "Update Google Scholar stats (${{ steps.fetch.outcome }})"
          git push -f "$REMOTE" HEAD:google-scholar-stats
